services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://mrbg:1234@db:5432/real_state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=mrbg
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=real_state
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrbg -d real_state"]
      interval: 5s
      timeout: 5s
      retries: 5